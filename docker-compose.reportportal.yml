
services:
  service-api:
    image: reportportal/service-api:5.12.1
    depends_on:
      - postgres
      - rabbitmq
    environment:
      RP_DB_USERNAME: rpuser
      RP_DB_PASSWORD: rppass
      RP_DB_HOST: postgres
      RP_DB_NAME: reportportal
      RP_RABBITMQ_HOST: rabbitmq
      RP_SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - reportportal

  service-authorization:
    image: reportportal/service-authorization:5.13.0
    depends_on:
      - service-api
    environment:
      RP_SERVER_PORT: 8081
      RP_API_HOST: service-api
    ports:
      - "8081:8081"
    networks:
      - reportportal

  service-ui:
    image: reportportal/service-ui:5.12.1
    depends_on:
      - service-api
      - service-authorization
    environment:
      RP_SERVER_PORT: 8082
      RP_API_HOST: service-api
      RP_AUTH_HOST: service-authorization
    ports:
      - "8082:8082"
    networks:
      - reportportal

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: rpuser
      POSTGRES_PASSWORD: rppass
      POSTGRES_DB: reportportal
    networks:
      - reportportal

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq
    networks:
      - reportportal

networks:
  reportportal:
